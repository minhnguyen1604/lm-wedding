<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thử gợi ý chạm vào đôi lego</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #ebe4d3; font-family: "Cormorant Garamond", serif; }
  .cot { position: relative; max-width: 520px; min-height: 100%; margin: 0 auto; background: #f7f2e7; overflow: hidden;
         display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .nen { position: absolute; inset: 0; background: url(../images/nen.jpg) center/cover; opacity: .35; }
  .san { position: relative; margin-top: -60px; }
  .doi { position: relative; display: block; width: 190px; cursor: pointer; -webkit-tap-highlight-color: transparent;
         transform-origin: 50% 100%; animation: lac 2.8s ease-in-out infinite alternate; }
  .doi img { display: block; width: 100%; filter: drop-shadow(0 4px 5px rgba(60, 55, 35, .16)); }
  @keyframes lac { from { transform: rotate(-2deg); } to { transform: rotate(2deg); } }
  .duong { display: block; width: 150px; margin: 4px auto 0; }

  /* A · Trái tim nhỏ đập nhịp ở góc trên */
  .tim-dap { position: absolute; right: -6px; top: 6px; width: 30px; height: 30px; pointer-events: none;
             animation: dap 1.1s ease-in-out infinite; }
  .tim-dap svg { width: 100%; height: 100%; fill: #e07a96; filter: drop-shadow(0 2px 3px rgba(150, 60, 80, .25)); }
  @keyframes dap { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.22); } 30% { transform: scale(1); } 45% { transform: scale(1.14); } }

  /* B · Ngón tay vẽ nét vàng chạm vào, có vòng gợn */
  .ngon-tay { position: absolute; right: -30px; bottom: 26px; width: 46px; pointer-events: none;
              animation: cham 1.8s ease-in-out infinite; }
  .ngon-tay svg { width: 100%; }
  @keyframes cham { 0%, 100% { transform: translate(0, 0); } 40% { transform: translate(-14px, -14px); } 50% { transform: translate(-14px, -14px) scale(.92); } 60% { transform: translate(-14px, -14px); } }
  .gon { position: absolute; left: 50%; top: 52%; width: 60px; height: 60px; margin: -30px 0 0 -30px; border-radius: 50%;
         border: 2px solid rgba(201, 162, 75, .8); pointer-events: none; opacity: 0; }
  .b .gon { animation: gon 1.8s ease-out infinite .75s; }
  @keyframes gon { 0% { opacity: .9; transform: scale(.4); } 70% { opacity: 0; transform: scale(2.4); } 100% { opacity: 0; } }

  /* C · Thỉnh thoảng tự bay ra vài trái tim nhỏ + vòng sáng dưới chân */
  .vong-chan { position: absolute; left: 50%; bottom: -6px; width: 150px; height: 26px; margin-left: -75px; border-radius: 50%;
               background: radial-gradient(ellipse, rgba(212, 168, 69, .38), rgba(212, 168, 69, 0) 70%);
               pointer-events: none; animation: sang 2.4s ease-in-out infinite; }
  @keyframes sang { 0%, 100% { opacity: .35; transform: scale(.85); } 50% { opacity: 1; transform: scale(1.1); } }

  .tim { position: absolute; width: 18px; height: 18px; pointer-events: none; }
  .tim svg { width: 100%; height: 100%; }

  .nut { position: fixed; left: 0; right: 0; bottom: 14px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; z-index: 5; padding: 0 10px; }
  .nut button { font: 600 16px "Cormorant Garamond", serif; color: #4a5134; background: #fffaf0; border: 1px solid #c9a24b;
                border-radius: 20px; padding: 7px 14px; cursor: pointer; }
  .nut button.dang { background: #4a5134; color: #fff; }
  .an { display: none; }
</style>
</head>
<body>
<div class="cot" id="cot">
  <div class="nen"></div>
  <div class="san">
    <div class="doi" id="doi" role="button" aria-label="Chạm để gửi tim">
      <img src="../images/lego/doi-be.png" alt="">
      <div class="tim-dap an" id="a"><svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.1 0 3.6 1.1 5.3 3 1.7-1.9 3.2-3 5.3-3 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z"/></svg></div>
      <div class="ngon-tay an" id="b"><svg viewBox="0 0 48 56" fill="#fffaf0" stroke="#b8892b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
        <path d="M16 30V9a4 4 0 0 1 8 0v15l12 2.5a5 5 0 0 1 4 5.6L38 46a8 8 0 0 1-8 7H22a8 8 0 0 1-6.4-3.2L7 38.5a3.6 3.6 0 0 1 5.3-4.8L16 37z"/>
        <path d="M24 24v9M30 25.2v8M35.5 26.4v7"/></svg></div>
      <div class="gon"></div>
      <div class="vong-chan an" id="c"></div>
    </div>
  </div>
  <svg class="duong" viewBox="0 0 120 12" stroke="#c9a24b"><path d="M0 6h44M76 6h44" stroke-width=".8"/><path d="M60 1.5 64.5 6 60 10.5 55.5 6z" fill="none" stroke-width=".8"/></svg>
  <div class="nut">
    <button data-k="a">A · Tim đập nhịp</button>
    <button data-k="b">B · Ngón tay chạm</button>
    <button data-k="c">C · Tim tự bay ra</button>
  </div>
</div>
<script>
  var TIM = '<svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.1 0 3.6 1.1 5.3 3 1.7-1.9 3.2-3 5.3-3 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z" fill="currentColor"/></svg>';
  var MAU = ["#e2578f", "#f29bb5", "#d98c98", "#c9a24b", "#efc2c9"];
  var doi = document.getElementById("doi"), kieu = "a", hen = null;

  function bayTim(so, to, cao) {      // trái tim bay lên từ đôi lego
    for (var i = 0; i < so; i++) {
      var t = document.createElement("div");
      t.className = "tim"; t.innerHTML = TIM; t.style.color = MAU[i % MAU.length];
      var s = (to || 1) * (14 + Math.random() * 14);
      t.style.width = t.style.height = s + "px";
      t.style.left = (35 + Math.random() * 30) + "%"; t.style.top = "38%";
      doi.appendChild(t);
      t.animate([
        { transform: "translate(0,0) scale(.3)", opacity: 0 },
        { transform: "translate(" + ((Math.random() - .5) * 60) + "px," + (-(cao || 90) * .4) + "px) scale(1)", opacity: 1, offset: .25 },
        { transform: "translate(" + ((Math.random() - .5) * 140) + "px," + (-(cao || 90) - Math.random() * 60) + "px) scale(.8)", opacity: 0 }
      ], { duration: 1400 + Math.random() * 600, easing: "ease-out", delay: i * 60 }).onfinish = (function (el) { return function () { el.remove(); }; })(t);
    }
  }
  function chon(k) {
    kieu = k;
    document.querySelectorAll(".nut button").forEach(function (b) { b.classList.toggle("dang", b.dataset.k === k); });
    ["a", "b", "c"].forEach(function (x) { document.getElementById(x).classList.toggle("an", x !== k); });
    doi.classList.toggle("b", k === "b");
    clearInterval(hen);
    if (k === "c") { bayTim(3, .7, 60); hen = setInterval(function () { bayTim(3, .7, 60); }, 3200); }
  }
  doi.addEventListener("click", function () { bayTim(14, 1, 110); });
  document.querySelectorAll(".nut button").forEach(function (b) { b.onclick = function () { chon(b.dataset.k); }; });
  chon("a");
</script>
</body>
</html>
