<!doctype html><html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thử pháo hoa</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#ebe4d3;font-family:"Cormorant Garamond",serif}
.cot{position:relative;max-width:520px;height:100%;margin:0 auto;background:#f7f2e7;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.nen{position:absolute;inset:0;background:url(../images/nen.jpg) center/cover;opacity:.2}
.cot>*:not(.nen):not(canvas){position:relative}
.logo{width:110px}
.ten{font-family:"Pinyon Script",cursive;font-size:46px;color:#7d7262;margin-top:6px}
.ngay{font-size:14px;font-weight:600;letter-spacing:.3em;color:#9a7a2e}
.doi{height:190px;margin-top:22px}
canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.nut{position:fixed;left:0;right:0;bottom:18px;display:flex;flex-wrap:wrap;justify-content:center;gap:8px;z-index:3;padding:0 10px}
.nut button{font:600 15px "Cormorant Garamond",serif;color:#4a5134;background:#fffaf0;border:1px solid #c9a24b;
  border-radius:20px;padding:7px 14px;cursor:pointer}
.nut button.dang{background:#4a5134;color:#fff}
</style></head><body>
<div class="cot">
  <div class="nen"></div>
  <img class="logo" src="../images/logo-lm-vang.png" alt="">
  <div class="ten">Save the date</div>
  <div class="ngay">— 02 . 01 . 2027 —</div>
  <img class="doi" src="../images/lego/doi-toc-den-toc.png" alt="">
  <canvas id="c"></canvas>
  <div class="nut">
    <button data-k="cu">Hiện tại</button>
    <button data-k="lieu">A · Liễu vàng</button>
    <button data-k="cuc">B · Hoa cúc 3 màu</button>
    <button data-k="tim">C · Trái tim</button>
  </div>
</div>
<script src="phao-hoa-cu.js"></script>
<script src="phao-hoa-moi.js"></script>
<script>
var c=document.getElementById("c"), dung=null;
document.querySelectorAll(".nut button").forEach(function(b){
  b.onclick=function(){
    if(dung) dung(); cancelAnimationFrame(window.__raf);
    document.querySelectorAll(".nut button").forEach(function(x){x.classList.toggle("dang",x===b)});
    if(b.dataset.k==="cu"){ phaoHoa(c); dung=null; } else dung=phaoHoaMoi(c,b.dataset.k);
  };
});
</script>
</body></html>
